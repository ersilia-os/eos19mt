Identifier: eos19mt
Slug: chebifier-antibiotic
Status: Ready
Title: Antibiotic classes prediction
Description: Assigns a molecule to antibiotic structural classes such as aminoglycosides, beta-lactams and polyketides, expressed as presence or absence across 38 categories inspired by the GARDP classification. Predictions rest on Chebifier, a neuro-symbolic approach from Glauer and colleagues that classifies chemicals into the ChEBI ontology by exploiting the ontology's own hierarchy during learning, allowing it to extend as ChEBI grows. Classes are inferred from structure alone, so an assignment reflects structural resemblance rather than demonstrated antibacterial activity.
